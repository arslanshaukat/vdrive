server {
    listen 80;
    # Change this to your domain or use the IP directly
    server_name drive.yourdomain.com 45.63.121.184;

    root /var/www/vdrive;
    index index.html;

    # Increase upload size to match backend limit (500MB)
    client_max_body_size 500M;

    # ── React SPA ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy to Node.js ───────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # For large uploads / streaming
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 500M;
    }

    # ── Optional: direct PocketBase UI access (admin only) ─
    # Remove this block if you don't want the PB UI exposed via nginx
    location /pb-admin/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # ── Cache static assets ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
